seed: 42
deterministic: true
device: auto            # auto | cpu | cuda | cuda:0
output_dir: outputs
experiment_name: mlforge_default
log_level: INFO

data:
  csv_path: null        # set to a CSV path to use real data instead of synthetic
  target_column: target
  n_samples: 6000
  n_features: 20
  n_informative: 10
  n_redundant: 4
  n_classes: 2
  class_sep: 1.0
  flip_y: 0.02
  missing_fraction: 0.02       # fraction of feature cells blanked in synthetic data
  max_missing_fraction: 0.5    # validation threshold per column
  val_size: 0.15
  test_size: 0.15

model:
  hidden_dims: [64, 32]
  activation: relu             # relu | tanh | gelu | leaky_relu | silu
  dropout: 0.1

baseline:
  C: 1.0
  max_iter: 500

training:
  epochs: 40
  batch_size: 128
  optimizer: adamw             # adam | adamw | sgd
  learning_rate: 0.001
  weight_decay: 0.0001
  momentum: 0.9                # used by sgd only
  max_grad_norm: 5.0           # null disables clipping
  scheduler: none              # none | plateau
  scheduler_factor: 0.5
  scheduler_patience: 3
  early_stopping_patience: 8   # 0 disables early stopping
  early_stopping_min_delta: 0.0001
  num_workers: 0
  pin_memory: auto             # auto | true | false (effective only on CUDA)

diagnostics:
  gradient_explosion_threshold: 1000.0
  gradient_vanishing_threshold: 1.0e-7

inference:
  device: auto
  batch_size: 256
  use_inference_mode: true     # false = plain autograd forward (baseline for comparison)
  use_amp: false               # CUDA float16 autocast; ignored on CPU
  adaptive_batch_size: true    # halve batch size and retry on OOM
  min_batch_size: 1
  max_api_batch_size: 1024

benchmark:
  warmup_iterations: 5
  iterations: 30
  batch_sizes: [1, 16, 64, 256]
  num_samples: 1024
  devices: [cpu, cuda]         # cuda is skipped automatically when unavailable
  rtol: 1.0e-4
  atol: 1.0e-4