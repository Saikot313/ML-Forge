seed: 7
deterministic: true
device: cpu
output_dir: outputs
experiment_name: quick_test
log_level: INFO

data:
  n_samples: 800
  n_features: 10
  n_informative: 6
  n_redundant: 2
  n_classes: 2
  missing_fraction: 0.02

model:
  hidden_dims: [16, 8]
  activation: relu
  dropout: 0.0

training:
  epochs: 6
  batch_size: 64
  learning_rate: 0.005
  early_stopping_patience: 3

inference:
  device: cpu
  batch_size: 64

benchmark:
  warmup_iterations: 1
  iterations: 3
  batch_sizes: [1, 32]
  num_samples: 64
  devices: [cpu]